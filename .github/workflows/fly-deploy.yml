# Deploys to Fly on every push to main, once the tests and the build pass.
name: Fly Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy at a time: a newer push waits for the one in progress.
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same Node as the Dockerfile (NODE_VERSION).
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
